[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fabric-workspace-deployment"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = []
authors = [
  { name = "Raki Rahman", email = "mdrakiburrahman@gmail.com" },
]
dependencies = [
  "azure-identity===1.25.1",
  "dacite==1.9.2",
  "fabric-cicd==1.3.0",
  "pillow==11.3.0",
  "pyyaml==6.0.3",
  "requests==2.32.5"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[dependency-groups]
dev = [
  "artifacts-keyring==1.0.0",
  "black==26.5.1",
  "build==1.6.1",
  "hatch==1.18.1",
  "hatchling==1.27.0",
  "keyring==25.7.0",
  "ms-fabric-cli @ git+https://github.com/microsoft/fabric-cli.git@0183fbf1809826040ed4805e6163cb51c1613cb9",
  "mypy==2.3.1",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "twine==7.0.0",
  "types-pyyaml==6.0.12.20260906",
  "types-requests==2.33.0.20260906",
]

[project.scripts]
fabric-workspace-deployment = "fabric_workspace_deployment.main:main"

[project.urls]
Documentation = "https://github.com/mdrakiburrahman/fabric-workspace-deployment#readme"
Issues = "https://github.com/mdrakiburrahman/fabric-workspace-deployment/issues"
Source = "https://github.com/mdrakiburrahman/fabric-workspace-deployment"

[tool.hatch.version]
source = "code"
path = "src/fabric_workspace_deployment/__about__.py"

[tool.uv]
default-groups = ["dev"]
environments = ["python_full_version == '3.12.14'"]
override-dependencies = ["pyyaml==6.0.3"]
package = false

[tool.black]
line-length = 2000
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/fabric_workspace_deployment", "tests"]

[[tool.mypy.overrides]]
module = ["fabric_cicd", "fabric_cicd.*"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["fabric_workspace_deployment", "tests"]
branch = true
parallel = true
omit = [
  "src/fabric_workspace_deployment/__about__.py",
]

[tool.coverage.paths]
fabric_workspace_deployment = ["src/fabric_workspace_deployment", "*/fabric-workspace-deployment/src/fabric_workspace_deployment"]
tests = ["tests", "*/fabric-workspace-deployment/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
