name: Devcontainer CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify in devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install host dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --registry=https://registry.npmjs.org/

      - name: Create empty Azure CLI state
        run: |
          rm -rf "${HOME}/.azure"
          mkdir -p "${HOME}/.azure"
          chmod 700 "${HOME}/.azure"

      - name: Run Nx tests in devcontainer
        run: npx --no-install nx run devcontainer:test

      - name: Remove devcontainer
        if: always()
        run: npx --no-install nx run devcontainer:down
