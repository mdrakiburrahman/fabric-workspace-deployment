name: Devcontainer CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen devcontainer verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install host orchestration dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Initialize empty Azure CLI state
        run: |
          rm -rf "${HOME}/.azure"
          mkdir -p "${HOME}/.azure"
          chmod 700 "${HOME}/.azure"

      - name: Build devcontainer
        run: npx nx run devcontainer:build

      - name: Start devcontainer
        run: npx nx run devcontainer:up

      - name: Verify inside devcontainer
        run: npx nx run devcontainer:test

      - name: Prove container reuse and inspect artifacts
        run: |
          before="$(bash .devcontainer/scripts/container-id.sh)"
          container_workspace="$(
            docker inspect "${before}" \
              | jq -r --arg source "${GITHUB_WORKSPACE}" '.[0].Mounts[] | select(.Source == $source) | .Destination'
          )"
          test -n "${container_workspace}"
          docker exec \
            --user vscode \
            --workdir "${container_workspace}" \
            "${before}" \
            bash -lc 'test -x dist/fabric-workspace-deployment && ls -l dist/fabric-workspace-deployment dist/*.whl dist/*.tar.gz reports/pytest.xml'
          after="$(bash .devcontainer/scripts/container-id.sh)"
          test "${before}" = "${after}"

      - name: Upload pytest results
        if: always() && hashFiles('reports/pytest.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: reports/pytest.xml
          if-no-files-found: error

      - name: Upload binary and Python packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            dist/fabric-workspace-deployment
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn

      - name: Remove labeled devcontainer resources
        if: always()
        run: bash .devcontainer/scripts/down.sh
